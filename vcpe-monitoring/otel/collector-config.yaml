receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

processors:
  batch:
    timeout: 2s

exporters:
  influxdb:
    endpoint: ${env:INFLUX_URL}
    token: ${env:INFLUX_TOKEN}
    org: ${env:INFLUX_ORG}
    bucket: ${env:INFLUX_BUCKET}
    timeout: 5s
    metrics_schema: telegraf-prometheus-v1

extensions:
  health_check:
    endpoint: 127.0.0.1:13133

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [influxdb]
